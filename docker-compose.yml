# Запуск: docker compose up --build → http://localhost:8080
# Наружу открыт только порт шлюза 8080; БД, API и UI доступны лишь внутри сети compose.

x-app: &app
  build:
    context: .
    dockerfile: docker/app.Dockerfile
    target: runtime
  env_file:
    - path: .env
      required: false            # поднимется и без cp .env.example .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-trip}:${POSTGRES_PASSWORD:-trip}@db:5432/${POSTGRES_DB:-trip}

services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trip}
      POSTGRES_DB: ${POSTGRES_DB:-trip}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  bootstrap:                     # одноразово: миграции → сид → RAG-индекс
    <<: *app
    command: ["python", "-m", "trip_pilot.cli", "bootstrap"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 10
    restart: unless-stopped

  ui:
    <<: *app
    command: ["streamlit", "run", "src/trip_pilot/ui/app.py"]
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 10
    restart: unless-stopped

  gateway:
    image: nginxinc/nginx-unprivileged:1.28-alpine   # без root, по умолчанию слушает 8080
    ports:
      - "8080:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      ui:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  pgadmin:                       # только для разработки: docker compose --profile tools up
    image: dpage/pgadmin4:9.8
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@example.com
      PGADMIN_DEFAULT_PASSWORD: dev
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
