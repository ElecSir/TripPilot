# Шлюз: единственный порт наружу (8080). / → Streamlit, /api и /health → FastAPI.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# DNS Docker: имена api/ui разрешаются заново, а не один раз при старте nginx.
# Иначе после пересоздания контейнера с новым IP шлюз отдавал бы 502.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    client_max_body_size 1m;

    set $api http://api:8000;
    set $ui  http://ui:8501;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health {
        proxy_pass $api/health;
    }

    location /api/ {
        proxy_pass $api;                     # маршруты FastAPI уже с префиксом /api
        proxy_http_version 1.1;
        proxy_buffering off;                 # SSE: события агента уходят клиенту сразу
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass $ui;
        proxy_http_version 1.1;              # Streamlit работает через WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
    }
}
