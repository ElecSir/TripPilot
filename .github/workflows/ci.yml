name: CI

# Экономим минуты Actions (лимит общий на организацию):
# - только pull request: после слияния в main тот же код повторно не проверяем;
# - черновики (Draft PR) и PR только с документацией пропускаем;
# - новый push в PR отменяет устаревший прогон.
# Ручной запуск — вкладка Actions → CI → Run workflow.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "tasks/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Все шаги CI — тот же скрипт, что и локально
        run: sh scripts/ci.sh

      - name: Остановить стек
        if: always()
        run: docker compose down -v
