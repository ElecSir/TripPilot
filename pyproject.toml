[project]
name = "trip-pilot"
version = "0.1.0"
description = "AI-агент для планирования поездок (трек «О!дин запрос», Ostrovok Hackathon 2026)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=1.50",
    "pgvector>=0.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "returns>=0.23",
    "sqlalchemy[asyncio]>=2.0.30",
    "streamlit>=1.40",
    "tenacity>=9.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trip_pilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # чтобы тесты всех зон импортировали фейки: from tests.fakes import ...

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["trip_pilot", "tests"]
